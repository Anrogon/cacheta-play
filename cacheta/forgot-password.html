
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recuperar senha - Cacheta Play</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        url("./assets/image/bg-blue.png")
        center/cover fixed no-repeat;

      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
    }

    .auth-card {
      width: min(440px, 94vw);
      padding: 34px 28px;

      border-radius: 22px;
      background: #1d4ed8;
      border: 1px solid rgba(212,175,55,.38);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 16px 36px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      color: #ffd86b;
      font-size: 30px;
      font-weight: 900;
    }

    .auth-subtitle {
      margin: 0 0 24px;
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,.88);
    }

    input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;

      border-radius: 14px;
      border: 1px solid rgba(212,175,55,.22);

      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 15px;
    }

    input::placeholder {
      color: rgba(255,255,255,.65);
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212,175,55,.18);
    }

    .auth-actions {
      display: grid;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(180deg,#a51f36,#731726);
      color: #fff;
      border: 1px solid rgba(212,175,55,.30);
      box-shadow: 0 8px 18px rgba(0,0,0,.24);
    }

    .primary:hover {
      filter: brightness(1.15);
    }

    .secondary {
      background: rgba(255,255,255,.10);
      color: #fff;
      border: 1px solid rgba(255,255,255,.18);
    }

    .secondary:hover {
      background: rgba(255,255,255,.16);
    }

    .auth-message {
      min-height: 22px;
      margin-top: 16px;
      text-align: center;
      color: #ffd86b;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 28px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">

    <h1>♠ Recuperar senha ♠</h1>

    <div class="auth-subtitle">
      Informe seu e-mail cadastrado para receber
      um link de recuperação de senha.
    </div>

    <input
      type="email"
      id="recoveryEmail"
      placeholder="Seu e-mail"
      autocomplete="email"
    >

    <div class="auth-actions">
      <button
        id="btnRecoverySubmit"
        class="primary"
        type="button">
        Enviar link de recuperação
      </button>

      <button
        id="btnBackLogin"
        class="secondary"
        type="button"
        onclick="window.location.href='./login.html'">
        Voltar ao login
      </button>
    </div>

    <div id="authMessage" class="auth-message"></div>

  </main>

  <script src="./js/forgot-password.js"></script>
  
</body>
</html>
