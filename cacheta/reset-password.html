
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Redefinir senha - Cacheta Play</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #071b43 url("./assets/image/bg-blue.png")
        center / cover no-repeat;
      color: #ffffff;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 16px;
      background: #123c78;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ffd86b;
      font-size: 25px;
    }

    .reset-description {
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.6;
      color: #e0e9f8;
    }

    .reset-card input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #8ba9d4;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .reset-card input:focus {
      border-color: #ffd86b;
    }

    .reset-card button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background: #b1223d;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset-card button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .reset-card .back-button {
      background: #244f88;
    }

    .auth-message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="reset-card">

    <h1>♠ Redefinir senha ♠</h1>

    <p class="reset-description">
      Digite sua nova senha para recuperar o acesso ao Cacheta Play.
    </p>

    <input
      type="password"
      id="newPassword"
      placeholder="Nova senha"
      autocomplete="new-password"
      minlength="6"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirmar nova senha"
      autocomplete="new-password"
      minlength="6"
    >

    <button id="btnResetPassword" type="button">
      Redefinir senha
    </button>

    <button
      class="back-button"
      type="button"
      onclick="window.location.href='./login.html'"
    >
      Voltar ao login
    </button>

    <div
      id="authMessage"
      class="auth-message"
      role="status"
      aria-live="polite"
    ></div>

  </main>

  <script src="./js/reset-password.js"></script>

</body>
</html>
